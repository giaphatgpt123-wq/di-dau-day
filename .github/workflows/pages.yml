name: Deploy D1 RC2 to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate repo-first PWA
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html rc2-app-services-v3.js app.js rc2-route-geometry-domain-v3.js rc2-core.js rc2-discovery.js rc2-data.js rc2-bulk.js rc2-seed.js rc2-geocode.js rc2-gps-health.js rc2-engine-v3.js rc2-driving.js rc2-alerts.js rc2-proactive.js rc2-driver-rest.js rc2-trip-status.js rc2-driving-mode.js rc2-unified-driving-ui.js rc2-ui-shell-v3.js rc2-bootstrap-v3.js styles.css manifest.webmanifest sw.js tests/b12-simulation.test.js tests/b13-gps-faults.test.js tests/b14-gps-hysteresis.test.js tests/core-engine-v3.test.js tests/core-v3-phase2-services.test.js tests/core-v3-phase3-route-geometry.test.js tests/core-v3-phase4-ui-bootstrap.test.js; do test -s "$f"; done
          for f in rc2-app-services-v3.js app.js rc2-route-geometry-domain-v3.js rc2-core.js rc2-discovery.js rc2-data.js rc2-bulk.js rc2-seed.js rc2-geocode.js rc2-gps-health.js rc2-engine-v3.js rc2-driving.js rc2-alerts.js rc2-proactive.js rc2-driver-rest.js rc2-trip-status.js rc2-driving-mode.js rc2-unified-driving-ui.js rc2-ui-shell-v3.js rc2-bootstrap-v3.js tests/b12-simulation.test.js tests/b13-gps-faults.test.js tests/b14-gps-hysteresis.test.js tests/core-engine-v3.test.js tests/core-v3-phase2-services.test.js tests/core-v3-phase3-route-geometry.test.js tests/core-v3-phase4-ui-bootstrap.test.js; do node --check "$f"; done
          node tests/b12-simulation.test.js
          node tests/b13-gps-faults.test.js
          node tests/b14-gps-hysteresis.test.js
          node tests/core-engine-v3.test.js
          node tests/core-v3-phase2-services.test.js
          node tests/core-v3-phase3-route-geometry.test.js
          node tests/core-v3-phase4-ui-bootstrap.test.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          domain=Path('rc2-route-geometry-domain-v3.js').read_text(encoding='utf-8')
          ui=Path('rc2-ui-shell-v3.js').read_text(encoding='utf-8')
          boot=Path('rc2-bootstrap-v3.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert html.index('app.js') < html.index('rc2-route-geometry-domain-v3.js') < html.index('rc2-core.js')
          assert html.index('rc2-unified-driving-ui.js') < html.index('rc2-ui-shell-v3.js') < html.index('rc2-bootstrap-v3.js')
          assert "'./rc2-ui-shell-v3.js'" in sw and "'./rc2-bootstrap-v3.js'" in sw
          for token in ['RouteDomain','GeometryDomain','recognizeRoute','edgeState','version:\'3.2.0-rc2\'']: assert token in domain
          for token in ['DiDauUiShell','renderRoutes','renderGeometry','renderLibrary','renderAdmin','version:\'3.3.0-rc2\'']: assert token in ui
          assert 'localStorage.' not in ui
          assert 'DiDauBootstrap' in boot and "version:'3.3.0-rc2'" in boot
          assert 'R-002' not in boot
          print('D1 RC2 CORE ENGINE V3.3 PHASE4 UI/BOOTSTRAP GATE: PASS')
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
