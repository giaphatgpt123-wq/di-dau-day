name: Deploy D1 RC2 to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate repo-first PWA
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html app.js rc2-core.js rc2-discovery.js rc2-data.js rc2-bulk.js rc2-seed.js rc2-geocode.js rc2-driving.js rc2-alerts.js rc2-proactive.js rc2-driver-rest.js rc2-trip-status.js rc2-driving-mode.js rc2-unified-driving-ui.js styles.css manifest.webmanifest sw.js; do test -s "$f"; done
          for f in app.js rc2-core.js rc2-discovery.js rc2-data.js rc2-bulk.js rc2-seed.js rc2-geocode.js rc2-driving.js rc2-alerts.js rc2-proactive.js rc2-driver-rest.js rc2-trip-status.js rc2-driving-mode.js rc2-unified-driving-ui.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          ui=Path('rc2-unified-driving-ui.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert '<script src="rc2-unified-driving-ui.js" defer></script>' in html
          assert "'./rc2-unified-driving-ui.js'" in sw
          for token in ['renderUnifiedDrivingUI','dataset.unifiedDrivingUi','SPEED_MOVING_KMH=5.4','Xem chi tiết','Chế độ lái xe','dataset.technicalPanel']: assert token in ui
          print('D1 RC2 R002 B11 UNIFIED UI GATE: PASS')
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
