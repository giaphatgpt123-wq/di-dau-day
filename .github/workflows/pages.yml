name: Deploy D1 RC1.5 PDH PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate D1 RC1.5 end-to-end release gate
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s data/routes-pdh.json
          test -s data/geometry-pdh.json
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s icons/apple-touch-icon.png
          python - <<'PY'
          import json
          from pathlib import Path

          m=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert m['display'] in {'standalone','fullscreen','minimal-ui'}
          sizes={i.get('sizes') for i in m['icons']}
          assert {'192x192','512x512'} <= sizes

          routes=json.loads(Path('data/routes-pdh.json').read_text(encoding='utf-8'))
          assert routes.get('version')=='PDH-ROUTES-2.0'
          rs=routes.get('routes',[])
          assert len(rs)==11
          assert [r['id'] for r in rs]==[f'R-{i:03d}' for i in range(1,12)]
          assert sum(len(r.get('segments',[])) for r in rs)==39
          s=routes.get('summary',{})
          assert s.get('nodes')==53 and s.get('bidirectionalEdges')==78 and s.get('crossLinks')==50

          geometry=json.loads(Path('data/geometry-pdh.json').read_text(encoding='utf-8'))
          assert geometry.get('version')=='PDH-GEOMETRY-1.0'
          nodes=geometry.get('nodes',[])
          assert len(nodes)==53
          assert [n['id'] for n in nodes]==[f'N-{i:03d}' for i in range(1,54)]
          assert geometry.get('policy',{}).get('approvalRequired') is True
          assert geometry.get('policy',{}).get('mapMatchingUsesApprovedOnly') is True
          assert all('lat' not in n and 'lng' not in n for n in nodes)

          html=Path('index.html').read_text(encoding='utf-8')
          assert 'D1-RC1.5' in html
          assert 'app.js?v=1.5.0' in html and 'styles.css?v=1.5.0' in html

          js=Path('app.js').read_text(encoding='utf-8')
          required=[
            "D1-RC1.5.0","APPROVED_GEOMETRY","FIELD_CAPTURED","APPROVED_TRACE","FIELD_TRACE",
            "edgeState","routeState","qaState","startTrace","stopTrace","approveTrace","distanceToTrace",
            "recognizeRoute","watchPosition","getCurrentPosition","accuracy>250","captureNode","approveNode",
            "exportBackup","importBackup","audit","openPoiForm","parseMapUrl","createUser","createAdmin"
          ]
          for token in required:
              assert token in js, f'Missing RC1.5 token: {token}'
          assert 'ROUTE_ANCHORS' not in js
          assert "status==='APPROVED_TRACE'" in js
          assert "status==='APPROVED_GEOMETRY'" in js

          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'd1-rc1.5-shell-v1' in sw
          for token in ['app.js','styles.css','routes-pdh.json','geometry-pdh.json',"cache:'no-store'"]:
              assert token in sw
          print('D1 RC1.5 END-TO-END RELEASE GATE: PASS')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
