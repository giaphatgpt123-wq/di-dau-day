name: Deploy A1 RC4 PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA release gate
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s install-qr.png
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s icons/apple-touch-icon.png
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          required={'name','short_name','start_url','scope','display','icons'}
          missing=required-set(m)
          assert not missing, f'Manifest missing: {sorted(missing)}'
          assert m['display'] in {'standalone','fullscreen','minimal-ui'}
          sizes={i.get('sizes') for i in m['icons']}
          assert '192x192' in sizes and '512x512' in sizes, 'Missing 192/512 PWA icons'
          for icon in m['icons']:
              src=icon.get('src','')
              if src and not src.startswith(('http://','https://')):
                  assert Path(src).is_file(), f'Missing manifest icon: {src}'
          html=Path('index.html').read_text(encoding='utf-8')
          assert "A1-RC4-GH1" in html, 'index.html is not RC1.2.0'
          assert 'manifest.webmanifest' in html, 'Manifest link missing from index.html'
          assert 'install-qr.png' in html, 'Install QR missing from index.html'
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'a1-rc4-gh1-shell-v1' in sw, 'Unexpected service-worker cache version'
          print('PWA RELEASE GATE: PASS')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
