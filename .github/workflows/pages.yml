name: Deploy D1 RC1.3.1 PDH PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate D1 RC1.3.1 PDH release gate
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s data/routes-pdh.json
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s icons/apple-touch-icon.png
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert m['display'] in {'standalone','fullscreen','minimal-ui'}
          sizes={i.get('sizes') for i in m['icons']}
          assert {'192x192','512x512'} <= sizes
          routes=json.loads(Path('data/routes-pdh.json').read_text(encoding='utf-8'))
          assert routes.get('version')=='PDH-ROUTES-2.0'
          rs=routes.get('routes',[])
          assert len(rs)==11, f'Expected 11 PDH corridors, got {len(rs)}'
          assert [r['id'] for r in rs]==[f'R-{i:03d}' for i in range(1,12)]
          assert sum(len(r.get('segments',[])) for r in rs)==39
          summary=routes.get('summary',{})
          assert summary.get('nodes')==53
          assert summary.get('bidirectionalEdges')==78
          assert summary.get('crossLinks')==50
          assert summary.get('activeEdges')==0
          html=Path('index.html').read_text(encoding='utf-8')
          for token in ['D1-RC1.3.1','Mạng tuyến PDH','PDH-ROUTES-2.0','watchPosition','createAdmin','installBox','R-001']:
              assert token in html, f'Missing RC1.3.1 token: {token}'
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'd1-rc1.3.1-shell-v2' in sw
          assert 'routes-pdh.json' in sw and "cache:'no-store'" in sw
          print('D1 RC1.3.1 PDH RELEASE GATE: PASS')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
