name: Deploy RC5.2 installer gateway to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate RC5.2 installer gateway
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'A1-RC5.2' in html
          assert 'di-dau-day-a1-mobile.giaphatgpt123.chatgpt.site/install.html' in html
          assert 'dữ liệu mẫu' in html.lower()
          print('RC5.2 INSTALLER GATE: PASS')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
