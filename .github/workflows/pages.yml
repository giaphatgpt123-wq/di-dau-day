name: Deploy D1 RC2 to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repo-first PWA
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s rc2-core.js
          test -s styles.css
          test -s manifest.webmanifest
          test -s sw.js
          test -s data/routes-pdh.json
          test -s data/geometry-pdh.json
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          node --check app.js
          node --check rc2-core.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          core=Path('rc2-core.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          manifest=Path('manifest.webmanifest').read_text(encoding='utf-8')
          required_ids=['accountBtn','gpsBtn','routeTitle','routeInfo','gpsStatus','gpsAccuracy','gpsMotion','gpsAge','routeDetect','installBox','installMsg','installBtn','search','main','modal']
          for item in required_ids:
              assert f'id="{item}"' in html, f'missing DOM id: {item}'
          assert '<script src="app.js" defer></script>' in html
          assert '<script src="rc2-core.js" defer></script>' in html
          assert 'http-equiv="refresh"' not in html.lower()
          assert "serviceWorker.register('./sw.js')" in app
          assert "'./app.js'" in sw and "'./rc2-core.js'" in sw and "'./styles.css'" in sw
          assert 'd1-gps-tracking' in core
          assert 'adminCreateUser' in core
          assert 'Dẫn đường' in core and 'Mở bản đồ' in core
          assert '"display":"standalone"' in manifest.replace(' ', '')
          print('D1 RC2 CORE GATE: PASS')
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
