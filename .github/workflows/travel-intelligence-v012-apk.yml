name: Travel Intelligence V0.12 APK

on:
  workflow_dispatch:
  push:
    branches:
      - travel-intelligence-v012-build-ci2
    paths:
      - 'ci/travel-intelligence-v012-clean/**'
      - '.github/workflows/travel-intelligence-v012-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify clean source archive
        shell: bash
        run: |
          cat ci/travel-intelligence-v012-clean/part{00..10} > /tmp/source.b64
          LEN=$(wc -c < /tmp/source.b64)
          echo "Base64 chars: $LEN"
          test "$LEN" -eq 143920
          base64 --decode /tmp/source.b64 > /tmp/travel-intelligence-v012-ci-source.zip
          echo '211975fafb729d60874701fd775dc21b666b8c21c4922d8990fab60d7cce4788  /tmp/travel-intelligence-v012-ci-source.zip' | sha256sum -c -
          unzip -tq /tmp/travel-intelligence-v012-ci-source.zip
          rm -rf build-src && mkdir build-src
          unzip -q /tmp/travel-intelligence-v012-ci-source.zip -d build-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK and API 37.0
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          sudo mkdir -p "$SDK_ROOT/licenses"
          sudo chown -R "$USER":"$USER" "$SDK_ROOT/licenses"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0' >/tmp/sdkmanager.log 2>&1 || { tail -80 /tmp/sdkmanager.log; exit 1; }
          test -d "$SDK_ROOT/platforms/android-37.0"
          echo "ANDROID_SDK_37_0_READY"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Detect project root
        id: project
        shell: bash
        run: |
          ROOT=$(find build-src -name settings.gradle.kts -type f -print -quit | xargs dirname)
          test -n "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Apply AGP 9 and Kotlin source compatibility fixes
        shell: bash
        run: |
          ROOT='${{ steps.project.outputs.root }}'
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$ROOT/build.gradle.kts"
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$ROOT/app/build.gradle.kts"
          sed -i '/kotlin { jvmToolchain(17) }/d' "$ROOT/app/build.gradle.kts"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('${{ steps.project.outputs.root }}')

          p = root / 'app/build.gradle.kts'
          s = p.read_text()
          old = '    buildFeatures { compose = true }'
          new = '    buildFeatures {\n        compose = true\n        buildConfig = true\n    }'
          if old not in s:
              raise SystemExit('buildFeatures patch target not found')
          p.write_text(s.replace(old, new))

          p = root / 'core/data/src/main/kotlin/com/travelintelligence/data/OpeningHoursEvaluator.kt'
          s = p.read_text()
          old = '''        if (value == null || value.value.isNullOrBlank()) return TrustedValue(null, DataTruthState.UNKNOWN)\n        val minute = localMinuteOfDay.coerceIn(0, 1439)\n        val raw = value.value.trim()'''
          new = '''        if (value == null) return TrustedValue(null, DataTruthState.UNKNOWN)\n        val rawValue = value.value ?: return TrustedValue(null, DataTruthState.UNKNOWN, value.evidence)\n        if (rawValue.isBlank()) return TrustedValue(null, DataTruthState.UNKNOWN, value.evidence)\n        val minute = localMinuteOfDay.coerceIn(0, 1439)\n        val raw = rawValue.trim()'''
          if old not in s:
              raise SystemExit('OpeningHoursEvaluator patch target not found')
          p.write_text(s.replace(old, new))

          p = root / 'core/data/src/main/kotlin/com/travelintelligence/data/TravelLibraryRepository.kt'
          s = p.read_text()
          old = '''        if (value == null || value.value.isNullOrBlank()) return TrustedValue(null, DataTruthState.UNKNOWN)\n        val raw = value.value.trim().lowercase()'''
          new = '''        if (value == null) return TrustedValue(null, DataTruthState.UNKNOWN)\n        val rawValue = value.value ?: return TrustedValue(null, DataTruthState.UNKNOWN, value.evidence)\n        if (rawValue.isBlank()) return TrustedValue(null, DataTruthState.UNKNOWN, value.evidence)\n        val raw = rawValue.trim().lowercase()'''
          if old not in s:
              raise SystemExit('TravelLibraryRepository patch target not found')
          p.write_text(s.replace(old, new))

          p = root / 'app/src/main/kotlin/com/travelintelligence/app/TravelIntelligenceApp.kt'
          s = p.read_text()
          old = '''                val priceLabel = when {\n                    rec.poi.priceText.value == null -> "Giá chưa có dữ liệu"\n                    rec.poi.priceText.truth == DataTruthState.VERIFIED -> rec.poi.priceText.value\n                    rec.poi.priceText.truth == DataTruthState.CONFLICTING -> "Giá đang xung đột"\n                    rec.poi.priceText.truth == DataTruthState.STALE -> "~${rec.poi.priceText.value} · dữ liệu cũ"\n                    else -> "~${rec.poi.priceText.value} · chưa xác minh"\n                }'''
          new = '''                val priceValue = rec.poi.priceText.value\n                val priceLabel: String = when {\n                    priceValue == null -> "Giá chưa có dữ liệu"\n                    rec.poi.priceText.truth == DataTruthState.VERIFIED -> priceValue\n                    rec.poi.priceText.truth == DataTruthState.CONFLICTING -> "Giá đang xung đột"\n                    rec.poi.priceText.truth == DataTruthState.STALE -> "~$priceValue · dữ liệu cũ"\n                    else -> "~$priceValue · chưa xác minh"\n                }'''
          if old not in s:
              raise SystemExit('priceLabel patch target not found')
          s = s.replace(old, new)
          old = '''            Text("• Collector: chỉ ghi Staging\n• Library AI: chuẩn hóa/đề xuất canonical\n• Quality AI: kiểm toán độc lập\n• Publishing Policy: quyết định publish", fontSize = 13.sp)'''
          new = '''            Text(\n                """• Collector: chỉ ghi Staging\n• Library AI: chuẩn hóa/đề xuất canonical\n• Quality AI: kiểm toán độc lập\n• Publishing Policy: quyết định publish""".trimIndent(),\n                fontSize = 13.sp,\n            )'''
          if old not in s:
              raise SystemExit('AI rights multiline patch target not found')
          s = s.replace(old, new)
          old = '''        Text("• Dừng xe tại nơi an toàn nếu có thể\n• Bật cảnh báo nguy hiểm của xe\n• Dùng điện thoại/dịch vụ khẩn cấp thực tế nếu cần\n• Không dựa vào dữ liệu app đang UNKNOWN", color = Color.White.copy(alpha=.9f))'''
          new = '''        Text(\n            """• Dừng xe tại nơi an toàn nếu có thể\n• Bật cảnh báo nguy hiểm của xe\n• Dùng điện thoại/dịch vụ khẩn cấp thực tế nếu cần\n• Không dựa vào dữ liệu app đang UNKNOWN""".trimIndent(),\n            color = Color.White.copy(alpha=.9f),\n        )'''
          if old not in s:
              raise SystemExit('Emergency multiline patch target not found')
          p.write_text(s.replace(old, new))
          PY
          if grep -R 'id("org.jetbrains.kotlin.android")' "$ROOT/build.gradle.kts" "$ROOT/app/build.gradle.kts"; then
            echo 'Legacy kotlin-android plugin still present'
            exit 1
          fi
          grep -n 'buildConfig = true' "$ROOT/app/build.gradle.kts"
          grep -n 'rawValue' "$ROOT/core/data/src/main/kotlin/com/travelintelligence/data/OpeningHoursEvaluator.kt" "$ROOT/core/data/src/main/kotlin/com/travelintelligence/data/TravelLibraryRepository.kt"
          grep -n 'priceValue' "$ROOT/app/src/main/kotlin/com/travelintelligence/app/TravelIntelligenceApp.kt"
          echo 'AGP_9_AND_KOTLIN_SOURCE_FIXES_APPLIED'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain :app:assembleDebug > /tmp/gradle-build.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo '=== GRADLE ERROR LINES ==='
            grep -nE '(^e:|^ERROR|FAILURE:|What went wrong|Could not|Unresolved reference|error:)' /tmp/gradle-build.log | tail -140 || true
            echo '=== GRADLE LAST 220 LINES ==='
            tail -220 /tmp/gradle-build.log
            exit "$STATUS"
          fi
          tail -100 /tmp/gradle-build.log
          echo 'ASSEMBLE_DEBUG_PASS'

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find '${{ steps.project.outputs.root }}/app/build/outputs/apk/debug' -name '*.apk' -type f | head -n1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/TravelIntelligence-v0.12-debug.apk
          unzip -tq out/TravelIntelligence-v0.12-debug.apk
          sha256sum out/TravelIntelligence-v0.12-debug.apk | tee out/SHA256.txt
          ls -lh out/TravelIntelligence-v0.12-debug.apk
          echo 'APK_ARTIFACT_VERIFIED'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TravelIntelligence-v0.12-debug-apk
          path: out/
          if-no-files-found: error
          retention-days: 30
