name: Travel Intelligence V0.12 APK

on:
  workflow_dispatch:
  push:
    branches:
      - travel-intelligence-v012-build-ci2
    paths:
      - 'ci/travel-intelligence-v012-clean/**'
      - '.github/workflows/travel-intelligence-v012-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify clean source archive
        shell: bash
        run: |
          cat ci/travel-intelligence-v012-clean/part{00..10} > /tmp/source.b64
          LEN=$(wc -c < /tmp/source.b64)
          echo "Base64 chars: $LEN"
          test "$LEN" -eq 143920
          test $((LEN % 4)) -eq 0
          base64 --decode /tmp/source.b64 > /tmp/travel-intelligence-v012-ci-source.zip
          echo '211975fafb729d60874701fd775dc21b666b8c21c4922d8990fab60d7cce4788  /tmp/travel-intelligence-v012-ci-source.zip' | sha256sum -c -
          unzip -t /tmp/travel-intelligence-v012-ci-source.zip
          rm -rf build-src
          mkdir build-src
          unzip -q /tmp/travel-intelligence-v012-ci-source.zip -d build-src
          find build-src -maxdepth 2 -type f | sort | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK and API 37.0
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK root: $SDK_ROOT"
          sudo mkdir -p "$SDK_ROOT/licenses"
          sudo chown -R "$USER":"$USER" "$SDK_ROOT/licenses"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 | grep -E 'platforms;android-37\.0|build-tools;37\.0\.0' || true
          "$SDKMANAGER" --channel=3 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'
          test -d "$SDK_ROOT/platforms/android-37.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Detect project root
        id: project
        shell: bash
        run: |
          ROOT=$(find build-src -name settings.gradle.kts -type f -print -quit | xargs dirname)
          test -n "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find '${{ steps.project.outputs.root }}/app/build/outputs/apk/debug' -name '*.apk' -type f | head -n1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/TravelIntelligence-v0.12-debug.apk
          sha256sum out/TravelIntelligence-v0.12-debug.apk | tee out/SHA256.txt
          ls -lh out/TravelIntelligence-v0.12-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TravelIntelligence-v0.12-debug-apk
          path: out/
          if-no-files-found: error
          retention-days: 30
