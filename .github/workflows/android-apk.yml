name: Build Android APK D1 RC2

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["android/**","index.html","app.js","rc2-core.js","rc2-discovery.js","rc2-data.js","rc2-bulk.js","rc2-seed.js","rc2-geocode.js","rc2-gps-health.js","rc2-driving.js","rc2-alerts.js","rc2-proactive.js","rc2-driver-rest.js","rc2-trip-status.js","rc2-driving-mode.js","rc2-unified-driving-ui.js","tests/**","styles.css","manifest.webmanifest","data/**","icons/**",".github/workflows/android-apk.yml"]
  pull_request:
    branches: ["main"]
    paths: ["android/**","index.html","app.js","rc2-core.js","rc2-discovery.js","rc2-data.js","rc2-bulk.js","rc2-seed.js","rc2-geocode.js","rc2-gps-health.js","rc2-driving.js","rc2-alerts.js","rc2-proactive.js","rc2-driver-rest.js","rc2-trip-status.js","rc2-driving-mode.js","rc2-unified-driving-ui.js","tests/**","styles.css","manifest.webmanifest","data/**","icons/**",".github/workflows/android-apk.yml"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate APK project
        shell: bash
        run: |
          set -euo pipefail
          for f in android/settings.gradle android/build.gradle android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/java/com/pdhtravel/didauday/MainActivity.java rc2-gps-health.js rc2-driving.js rc2-driver-rest.js rc2-trip-status.js tests/b12-simulation.test.js tests/b13-gps-faults.test.js; do test -s "$f"; done
          for f in app.js rc2-core.js rc2-discovery.js rc2-data.js rc2-bulk.js rc2-seed.js rc2-geocode.js rc2-gps-health.js rc2-driving.js rc2-alerts.js rc2-proactive.js rc2-driver-rest.js rc2-trip-status.js rc2-driving-mode.js rc2-unified-driving-ui.js tests/b12-simulation.test.js tests/b13-gps-faults.test.js; do node --check "$f"; done
          node tests/b12-simulation.test.js
          node tests/b13-gps-faults.test.js
          for f in rc2-core.js rc2-discovery.js rc2-data.js rc2-bulk.js rc2-seed.js rc2-geocode.js rc2-gps-health.js rc2-driving.js rc2-alerts.js rc2-proactive.js rc2-driver-rest.js rc2-trip-status.js rc2-driving-mode.js rc2-unified-driving-ui.js; do grep -q "include '$f'" android/app/build.gradle; done
          grep -q "STALE_MS=20000" rc2-gps-health.js
          grep -q "MAX_DRIVING_ACCURACY=120" rc2-gps-health.js
          grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
      - name: Build installable debug APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Verify bundled offline web assets
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html app.js rc2-core.js rc2-discovery.js rc2-data.js rc2-bulk.js rc2-seed.js rc2-geocode.js rc2-gps-health.js rc2-driving.js rc2-alerts.js rc2-proactive.js rc2-driver-rest.js rc2-trip-status.js rc2-driving-mode.js rc2-unified-driving-ui.js data/routes-pdh.json data/geometry-pdh.json; do test -s "android/app/src/main/assets/www/$f"; done
      - name: Prepare single-file installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Di-Dau-Day-D1-RC2.apk
          test -s dist/Di-Dau-Day-D1-RC2.apk
          sha256sum dist/Di-Dau-Day-D1-RC2.apk | tee dist/Di-Dau-Day-D1-RC2.apk.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Di-Dau-Day-D1-RC2-APK
          path: |
            dist/Di-Dau-Day-D1-RC2.apk
            dist/Di-Dau-Day-D1-RC2.apk.sha256
          if-no-files-found: error
          retention-days: 30