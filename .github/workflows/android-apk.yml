name: Build Android APK D1 RC1.5

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "manifest.webmanifest"
      - "data/**"
      - "icons/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate APK project
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle
          test -s android/build.gradle
          test -s android/app/build.gradle
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/java/com/pdhtravel/didauday/MainActivity.java
          grep -q "com.pdhtravel.didauday" android/app/build.gradle
          grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          grep -q "onGeolocationPermissionsShowPrompt" android/app/src/main/java/com/pdhtravel/didauday/MainActivity.java
          grep -q "onShowFileChooser" android/app/src/main/java/com/pdhtravel/didauday/MainActivity.java
          grep -q "giaphatgpt123-wq.github.io/di-dau-day" android/app/src/main/java/com/pdhtravel/didauday/MainActivity.java

      - name: Build installable debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Prepare single-file installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Di-Dau-Day-D1-RC1.5.apk
          test -s dist/Di-Dau-Day-D1-RC1.5.apk
          sha256sum dist/Di-Dau-Day-D1-RC1.5.apk | tee dist/Di-Dau-Day-D1-RC1.5.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Di-Dau-Day-D1-RC1.5-APK
          path: dist/Di-Dau-Day-D1-RC1.5.apk
          if-no-files-found: error
          retention-days: 30
