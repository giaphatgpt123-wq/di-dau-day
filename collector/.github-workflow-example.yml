name: A1 TIC Collector
on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s collector/tests
      - run: python collector/run.py --input collector/examples/osm_sample.json --output /tmp/a1-tic-poi.json
