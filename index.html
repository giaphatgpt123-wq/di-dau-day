<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153d2a"><meta name="description" content="PDH Travel - Đi Đâu Đây D1 RC1.3.1"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><title>Đi Đâu Đây · PDH Travel</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17211b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.app{max-width:980px;margin:auto;padding:12px 12px 88px}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:950}.brand small{display:block;font-size:10px;color:#728078}.pill{border:1px solid #d8e0da;background:#fff;border-radius:999px;padding:9px 12px;font-weight:850;font-size:11px}.hero{position:relative;background:linear-gradient(135deg,#153d2a,#245b40);color:#fff;border-radius:22px;padding:18px}.hero h1{font-size:21px;margin:5px 72px 7px 0}.hero p{margin:0;font-size:12px;opacity:.86}.gps{position:absolute;right:16px;top:16px;width:62px;height:62px;border:0;border-radius:50%;background:#f2b64a;font-size:29px;font-weight:950;box-shadow:0 8px 20px #0004}.gpsline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px;background:#ffffff14;border-radius:13px;padding:10px 12px;font-size:12px}.install{margin-top:12px;background:#fff;color:#17211b;border-radius:15px;padding:12px}.install.hidden{display:none}.install button{border:0;border-radius:10px;padding:10px 12px;font-weight:900}.primary{background:#f2b64a}.muted{background:#edf2ee}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button{white-space:nowrap;border:1px solid #dbe3dd;background:#fff;border-radius:12px;padding:10px 13px;font-weight:850;font-size:12px}.tabs button.active{background:#153d2a;color:#fff}.search{background:#fff;border:1px solid #e0e7e2;border-radius:14px;padding:11px;margin-bottom:12px}.search input{width:100%;border:0;outline:0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}.metric{background:#fff;border:1px solid #e0e7e2;border-radius:14px;padding:11px}.metric b{font-size:18px;display:block}.metric small{font-size:9px;color:#6e7d74}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.panel{background:#fff;border:1px solid #e0e7e2;border-radius:17px;padding:14px}.route{cursor:pointer}.route.selected{outline:2px solid #1d6544}.route h3{margin:7px 0}.meta{font-size:11px;color:#718078;line-height:1.45}.tag{display:inline-block;background:#edf3ef;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850;margin:0 4px 5px 0}.tag.warn{background:#fff1d7;color:#885d00}.tag.block{background:#fde8e6;color:#9a3028}.seg{border-top:1px solid #edf1ee;padding:9px 0;font-size:12px}.seg:first-of-type{margin-top:8px}.seg b{display:block}.notice{font-size:11px;background:#fff8e7;border:1px solid #f0ddaf;padding:10px;border-radius:12px;margin:10px 0}.good{color:#20613f;font-weight:900}.bad{color:#a33c32;font-weight:900}.nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fffffff3;border-top:1px solid #dce4de;display:flex;justify-content:center;backdrop-filter:blur(10px)}.nav button{flex:1;max-width:220px;border:0;background:transparent;font-size:11px;font-weight:900}.nav button.active{color:#17452f}.modalbg{position:fixed;inset:0;background:#07110b99;display:flex;align-items:flex-end;justify-content:center;z-index:40}.modal{width:min(560px,100%);background:#fff;padding:20px;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto}.modal input{width:100%;padding:11px;border:1px solid #dae2dc;border-radius:10px;margin:5px 0 11px}.modal button{border:0;border-radius:10px;padding:11px 13px;font-weight:900}@media(max-width:720px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.app{padding-left:10px;padding-right:10px}}</style></head><body><div class="app"><header class="top"><div class="brand">Đi Đâu Đây<small>PDH Travel · D1-RC1.3.1 · Mạng tuyến gốc</small></div><button class="pill" id="accountBtn">Tài khoản</button></header><section class="hero"><button class="gps" id="gpsBtn" aria-label="Cập nhật GPS">⌖</button><small>TUYẾN ĐANG CHỌN</small><h1 id="routeTitle">Đang tải PDH…</h1><p id="routeInfo">Nguồn: ST_Travel_Mang_Tuyen_TPHCM.xlsx</p><div class="gpsline"><span id="gpsStatus">GPS: chưa xác định</span><span id="gpsAccuracy">Sai số: —</span></div><div class="install" id="installBox"><b>Cài ứng dụng</b><div id="installMsg" class="meta" style="margin:6px 0 9px">Đang kiểm tra khả năng cài.</div><button class="primary" id="installBtn">Cài ngay</button> <button class="muted" id="installHelp">Hướng dẫn</button></div></section><div class="tabs"><button data-view="routes" class="active">Mạng tuyến PDH</button><button data-view="library">Thư viện tuyến</button><button data-view="admin">Admin</button></div><div class="search"><input id="search" placeholder="Tìm R-001, Tây Ninh, QL22, Măng Đen…"></div><main id="main"><div class="panel">Đang tải mạng tuyến PDH Travel…</div></main></div><nav class="nav"><button data-nav="routes" class="active">Tuyến</button><button data-nav="library">Thư viện</button><button data-nav="account">Tài khoản</button></nav><div id="modal"></div><script>const APP_VERSION='D1-RC1.3.1',DATA_VERSION='PDH-ROUTES-2.0';let routeData={routes:[],summary:{}},currentRouteId=localStorage.getItem('d1-route')||'R-001',view='routes',installPrompt=null,watchId=null;const $=id=>document.getElementById(id);const users=()=>JSON.parse(localStorage.getItem('d1-users')||'[]');const session=()=>JSON.parse(localStorage.getItem('d1-session')||'null');const setUsers=v=>localStorage.setItem('d1-users',JSON.stringify(v));const setSession=v=>v?localStorage.setItem('d1-session',JSON.stringify(v)):localStorage.removeItem('d1-session');function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function syncInstall(){if(isStandalone()){$('installBox').classList.add('hidden');return}$('installBox').classList.remove('hidden');const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);$('installMsg').textContent=installPrompt?'Thiết bị sẵn sàng cài PWA.':ios?'Safari → Chia sẻ → Thêm vào Màn hình chính.':'Chrome/Edge → menu → Cài ứng dụng.'}addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;syncInstall()});addEventListener('appinstalled',()=>{installPrompt=null;syncInstall()});$('installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;syncInstall()}else alert($('installMsg').textContent)};$('installHelp').onclick=()=>alert('Android: Chrome/Edge → menu → Cài ứng dụng. iPhone/iPad: Safari → Chia sẻ → Thêm vào Màn hình chính.');function routeById(id){return routeData.routes.find(r=>r.id===id)||routeData.routes[0]}function statusClass(s=''){return /CHẶN|KHÔNG DÙNG/.test(s)?'block':/CẦN|KIỂM TRA/.test(s)?'warn':''}function selectRoute(id){currentRouteId=id;localStorage.setItem('d1-route',id);updateHero();render()}function updateHero(){const r=routeById(currentRouteId);if(!r)return;$('routeTitle').textContent=`${r.id} · ${r.name}`;$('routeInfo').textContent=`${r.group} · ${r.segments.length} đoạn · ${r.setupStatus}`}function metrics(){const s=routeData.summary;return `<div class="metrics"><div class="metric"><b>${s.corridors??'—'}</b><small>HÀNH LANG</small></div><div class="metric"><b>${s.segments??'—'}</b><small>ĐOẠN TUYẾN</small></div><div class="metric"><b>${s.nodes??'—'}</b><small>NÚT MẠNG</small></div><div class="metric"><b>${s.bidirectionalEdges??'—'}</b><small>CẠNH HAI CHIỀU</small></div><div class="metric"><b>${s.crossLinks??'—'}</b><small>LIÊN KẾT CHÉO</small></div><div class="metric"><b>${s.activeEdges??'—'}</b><small>CẠNH ACTIVE</small></div></div>`}function renderRoutes(q=''){const list=routeData.routes.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));$('main').innerHTML=`<h2>Mạng tuyến PDH Travel <small>(${list.length}/11)</small></h2>${metrics()}<div class="notice"><b>Trạng thái mạng: ${routeData.summary.networkStatus||'DRAFT'}</b>. Không tự biến đoạn PENDING/DRAFT thành tuyến dẫn đường ACTIVE. Các đoạn tương lai hoặc chưa liên tục vẫn bị chặn theo dữ liệu PDH.</div><div class="grid">${list.map(r=>`<article class="panel route ${r.id===currentRouteId?'selected':''}" onclick="selectRoute('${r.id}')"><span class="tag">${r.id}</span><span class="tag">${r.group}</span><span class="tag">Ưu tiên ${r.priority}</span><h3>${r.name}</h3><div class="meta"><b>${r.start} → ${r.end}</b><br>Vùng dữ liệu: ${r.radiusKm} km<br>Qua/nhánh: ${r.intermediates}</div><p class="meta"><b>Tuyến chính:</b> ${r.primary}</p><p class="meta"><b>Thay thế:</b> ${r.alternate}</p><span class="tag ${statusClass(r.setupStatus)}">${r.setupStatus}</span>${r.segments.map(s=>`<div class="seg"><span class="tag">${s.id}</span><span class="tag">${s.role}</span><span class="tag ${statusClass(s.status)}">${s.status}</span><b>${s.from} → ${s.to}</b><div class="meta">${s.road}<br>${s.verify}</div></div>`).join('')}</article>`).join('')}</div>`}function renderLibrary(q=''){const r=routeById(currentRouteId);if(!r){$('main').innerHTML='<div class="panel">Không có dữ liệu tuyến.</div>';return}$('main').innerHTML=`<h2>Thư viện tuyến</h2>${metrics()}<div class="panel"><span class="tag">${r.id}</span><h3>${r.name}</h3><div class="meta">${r.group} · bán kính dữ liệu ${r.radiusKm} km</div><p><b>Tuyến chính dự kiến:</b><br>${r.primary}</p><p><b>Đường thay thế/đường vòng:</b><br>${r.alternate}</p><p><b>Điểm trung gian/nhánh:</b><br>${r.intermediates}</p><p><b>Kiểm soát:</b><br>${r.controlNote}</p>${r.segments.map(s=>`<div class="seg"><b>${s.id} · ${s.from} → ${s.to}</b><div>${s.road}</div><div class="meta">${s.role} · ${s.status}<br>${s.verify}</div></div>`).join('')}</div><div class="notice">Dữ liệu POI chi tiết TP.HCM–Huế và POI các tuyến là lớp dữ liệu riêng; không giả định địa điểm chưa đủ trường là đã khảo sát.</div>`}function renderAdmin(){const s=session();if(!s||s.role!=='admin'){$('main').innerHTML='<div class="panel"><h2>Admin</h2><p>Chưa đăng nhập Admin.</p><button class="pill" onclick="openAccount()">Đăng nhập / tạo Admin cục bộ</button></div>';return}$('main').innerHTML=`<div class="panel"><h2>Admin Console</h2><p class="good">${s.email}</p><p>Data: <b>${DATA_VERSION}</b></p><p>Hành lang: ${routeData.summary.corridors} · đoạn: ${routeData.summary.segments} · ACTIVE: ${routeData.summary.activeEdges}</p><div class="notice">Tài khoản hiện lưu cục bộ trên thiết bị; chưa phải backend authentication.</div></div>`}function render(){const q=$('search').value.toLowerCase().trim();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));if(view==='routes')renderRoutes(q);else if(view==='library')renderLibrary(q);else renderAdmin()}$('search').oninput=render;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='account')openAccount();else{view=b.dataset.nav;render()}});$('gpsBtn').onclick=()=>startGPS();function startGPS(){if(!navigator.geolocation){$('gpsStatus').textContent='GPS: không hỗ trợ';return}if(watchId!==null)navigator.geolocation.clearWatch(watchId);$('gpsStatus').textContent='GPS: đang xác định…';watchId=navigator.geolocation.watchPosition(p=>{const a=Math.round(p.coords.accuracy||0);$('gpsStatus').textContent=`GPS: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;$('gpsAccuracy').textContent=`Sai số: ±${a} m`;$('gpsAccuracy').className=a<=50?'good':a>150?'bad':'';localStorage.setItem('d1-last-gps',JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:a,at:Date.now()}))},e=>{$('gpsStatus').textContent=`GPS: lỗi ${e.code}`;$('gpsAccuracy').textContent='Kiểm tra quyền vị trí';$('gpsAccuracy').className='bad'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}window.openAccount=function(){const s=session();$('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Tài khoản</h2>${s?`<p>Đang đăng nhập: <b>${s.email}</b> · ${s.role}</p><button onclick="logout()">Đăng xuất</button>`:`<input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Mật khẩu"><button class="primary" onclick="login()">Đăng nhập</button> <button onclick="createAdmin()">Tạo Admin đầu tiên</button>`}<p class="meta">RC1.3.1: tài khoản chỉ lưu cục bộ để kiểm thử RBAC giao diện.</p></div></div>`};window.closeModal=()=>{$('modal').innerHTML=''};window.createAdmin=async()=>{const email=$('email').value.trim().toLowerCase(),pass=$('pass').value;if(!email||pass.length<6)return alert('Email hợp lệ và mật khẩu tối thiểu 6 ký tự.');let u=users();if(u.some(x=>x.role==='admin'))return alert('Thiết bị này đã có Admin.');u.push({email,passHash:await hash(pass),role:'admin'});setUsers(u);setSession({email,role:'admin'});closeModal();render();};window.login=async()=>{const email=$('email').value.trim().toLowerCase(),passHash=await hash($('pass').value);const u=users().find(x=>x.email===email&&x.passHash===passHash);if(!u)return alert('Sai tài khoản hoặc mật khẩu.');setSession({email:u.email,role:u.role});closeModal();render();};window.logout=()=>{setSession(null);closeModal();render()};$('accountBtn').onclick=openAccount;async function boot(){syncInstall();try{const res=await fetch(`data/routes-pdh.json?v=${DATA_VERSION}`,{cache:'reload'});if(!res.ok)throw new Error('HTTP '+res.status);routeData=await res.json();if(routeData.version!==DATA_VERSION)throw new Error('Sai phiên bản dữ liệu '+routeData.version);if(!routeData.routes.some(r=>r.id===currentRouteId))currentRouteId='R-001';updateHero();render()}catch(e){$('main').innerHTML=`<div class="panel"><h2 class="bad">Không nạp được mạng tuyến PDH</h2><p>${e.message}</p><p>Đóng hoàn toàn ứng dụng rồi mở lại để Service Worker cập nhật.</p></div>`}}boot();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
