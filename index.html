<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163d2a"><meta name="description" content="PDH Travel - Đi Đâu Đây D1 RC1.3"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><title>Đi Đâu Đây D1 RC1.3</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17211b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:980px;margin:auto;padding:12px 12px 92px}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;font-size:18px}.brand small{display:block;color:#718078;font-size:10px}.pill{border:1px solid #d8e0da;background:#fff;border-radius:999px;padding:9px 12px;font-weight:850;font-size:11px}.hero{position:relative;background:linear-gradient(135deg,#163d2a,#245b40);color:#fff;border-radius:22px;padding:18px}.hero h1{font-size:21px;margin:4px 70px 7px 0}.hero p{font-size:12px;opacity:.84;margin:0}.gps{position:absolute;right:16px;top:16px;width:62px;height:62px;border:0;border-radius:50%;background:#f3b74d;font-size:29px;font-weight:950;box-shadow:0 8px 20px #0004}.gpsline{margin-top:14px;background:#ffffff14;border-radius:13px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px}.install{margin-top:12px;background:#fff;color:#17211b;border-radius:15px;padding:12px}.install.hidden{display:none}.install button{border:0;border-radius:10px;padding:10px 12px;font-weight:900}.primary{background:#f3b74d}.muted{background:#edf2ee}.tabs,.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button,.cats button{white-space:nowrap;border:1px solid #dbe3dd;background:#fff;border-radius:12px;padding:10px 13px;font-weight:850;font-size:12px}.tabs button.active,.cats button.active{background:#163d2a;color:#fff}.search{background:#fff;border:1px solid #e0e7e2;border-radius:14px;padding:11px;margin-bottom:12px}.search input{width:100%;border:0;outline:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.panel,.card{background:#fff;border:1px solid #e0e7e2;border-radius:17px;padding:14px}.route h3,.card h3{margin:5px 0}.meta{font-size:11px;color:#738078}.tag{display:inline-block;background:#edf3ef;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800;margin-right:5px}.seg{padding:9px 0;border-top:1px solid #edf1ee;font-size:12px}.seg:first-child{border-top:0}.notice{font-size:11px;background:#fff8e7;border:1px solid #f0ddaf;padding:10px;border-radius:12px;margin:10px 0}.good{color:#20613f;font-weight:900}.bad{color:#a33c32;font-weight:900}.actions{display:flex;gap:7px;margin-top:10px}.actions>*{flex:1;border:0;border-radius:10px;padding:10px;text-align:center;text-decoration:none;font-weight:900;font-size:11px}.go{background:#183f2d;color:#fff}.save{background:#edf2ee;color:#244532}.nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fffffff4;border-top:1px solid #dce4de;display:flex;justify-content:center;backdrop-filter:blur(10px)}.nav button{flex:1;max-width:200px;border:0;background:transparent;font-size:11px;font-weight:900}.nav button.active{color:#17452f}.modalbg{position:fixed;inset:0;background:#07110b99;display:flex;align-items:flex-end;justify-content:center;z-index:40}.modal{width:min(600px,100%);background:#fff;padding:20px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto}.modal input,.modal select,.modal textarea{width:100%;padding:11px;border:1px solid #dae2dc;border-radius:10px;margin:5px 0 11px}.modal button{border:0;border-radius:10px;padding:11px 13px;font-weight:900}.close{float:right;background:#edf2ee}@media(max-width:720px){.grid{grid-template-columns:1fr}.app{padding-left:10px;padding-right:10px}}</style></head><body><div class="app"><header class="top"><div class="brand">Đi Đâu Đây<small>PDH Travel · D1-RC1.3 Functional Recovery</small></div><button class="pill" id="accountBtn">Tài khoản</button></header><section class="hero"><button class="gps" id="gpsBtn" aria-label="Cập nhật GPS">⌖</button><small>HÀNH TRÌNH ĐANG CHỌN</small><h1 id="routeTitle">TP.HCM → Huế</h1><p id="routeCorridor">Đang tải dữ liệu tuyến…</p><div class="gpsline"><span id="gpsStatus">GPS: chưa xác định</span><span id="gpsAccuracy">Sai số: —</span></div><div class="install" id="installBox"><b>Cài ứng dụng</b><div id="installMsg" class="meta" style="margin:6px 0 9px">Đang kiểm tra khả năng cài.</div><button class="primary" id="installBtn">Cài ngay</button> <button class="muted" id="installHelp">Hướng dẫn</button></div></section><div class="tabs"><button data-view="routes" class="active">Tuyến & lộ trình</button><button data-view="discover">Điểm quanh tuyến</button><button data-view="library">Thư viện</button><button data-view="admin">Admin</button></div><div class="search"><input id="search" placeholder="Tìm tuyến, địa phương, quán ăn, lưu trú…"></div><div class="cats" id="cats"></div><main id="main"><div class="panel">Đang tải dữ liệu PDH Travel…</div></main></div><nav class="nav"><button data-nav="routes" class="active">Tuyến</button><button data-nav="discover">Khám phá</button><button data-nav="library">Thư viện</button><button data-nav="account">Tài khoản</button></nav><div id="modal"></div><script>const APP_VERSION='D1-RC1.3.0',SCHEMA=3;let routeData={routes:[]},currentRouteId='R-HCM-HUE-QL1A',view='routes',activeCat='Tất cả',installPrompt=null,watchId=null;const categories=['Tất cả','Ăn uống','Coffee','Lưu trú','Trạm dừng','Cây xăng','Tham quan','Vui chơi','Tâm linh'];const seedPOI=[{id:'p1',name:'Điểm mẫu cần xác minh',cat:'Trạm dừng',routeId:'R-HCM-HUE-QL1A',segmentId:'S02',lat:10.95,lng:107.01,verified:false,note:'Bản ghi kỹ thuật để kiểm thử; không phải địa điểm đã xác minh.'}];const userPOI=()=>JSON.parse(localStorage.getItem('d1-user-poi')||'[]'),saved=()=>JSON.parse(localStorage.getItem('d1-saved')||'[]'),session=()=>JSON.parse(localStorage.getItem('d1-session')||'null'),users=()=>JSON.parse(localStorage.getItem('d1-users')||'[]'),setUsers=x=>localStorage.setItem('d1-users',JSON.stringify(x)),setSession=x=>x?localStorage.setItem('d1-session',JSON.stringify(x)):localStorage.removeItem('d1-session');function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function syncInstall(){if(isStandalone()){installBox.classList.add('hidden');return}installBox.classList.remove('hidden');let ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);installMsg.textContent=installPrompt?'Thiết bị sẵn sàng cài PWA.':ios?'Safari → Chia sẻ → Thêm vào Màn hình chính.':'Chrome/Edge: menu → Cài ứng dụng/Thêm vào màn hình chính.'}addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;syncInstall()});addEventListener('appinstalled',()=>{installPrompt=null;localStorage.setItem('d1-installed-at',new Date().toISOString());syncInstall()});installBtn.onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;syncInstall()}else alert(installMsg.textContent)};installHelp.onclick=()=>alert('Android: Chrome/Edge → menu → Cài ứng dụng. iPhone/iPad: Safari → Chia sẻ → Thêm vào Màn hình chính.');function drawCats(){cats.innerHTML=categories.map(c=>`<button data-cat="${c}" class="${c===activeCat?'active':''}">${c}</button>`).join('');cats.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;drawCats();render()})}function routeById(id){return routeData.routes.find(r=>r.id===id)||routeData.routes[0]}function selectRoute(id){currentRouteId=id;localStorage.setItem('d1-route',id);updateHero();render()}function updateHero(){let r=routeById(currentRouteId);if(!r)return;routeTitle.textContent=r.name;routeCorridor.textContent=`${r.region} · ${r.corridor} · ${r.segments.length} chặng`}function renderRoutes(q=''){let list=routeData.routes.filter(r=>!q||`${r.name} ${r.region} ${r.corridor} ${r.segments.map(s=>s.from+' '+s.to+' '+s.via.join(' ')).join(' ')}`.toLowerCase().includes(q));main.innerHTML=`<h2>Tuyến & lộ trình PDH Travel <small>(${list.length})</small></h2><div class="grid">${list.map(r=>`<article class="panel route" onclick="selectRoute('${r.id}')"><span class="tag">${r.region}</span><span class="tag">${r.type}</span><h3>${r.name}</h3><div class="meta">${r.corridor} · ${r.segments.length} chặng</div>${r.segments.map(s=>`<div class="seg"><b>${s.from} → ${s.to}</b><br><span class="meta">${s.via.join(' / ')} · ~${s.kmApprox} km</span></div>`).join('')}</article>`).join('')}</div>`}function renderDiscover(q=''){let list=[...seedPOI,...userPOI()].filter(p=>p.routeId===currentRouteId&&(activeCat==='Tất cả'||p.cat===activeCat)&&(!q||`${p.name} ${p.cat} ${p.note||''}`.toLowerCase().includes(q)));main.innerHTML=`<h2>Điểm quanh tuyến</h2><div class="notice">RC1.3 không gắn tích xanh cho dữ liệu chưa xác minh.</div><div class="grid">${list.length?list.map(p=>`<article class="card"><span class="tag">${p.cat}</span><h3>${p.name}</h3><div class="meta">${p.verified?'<span class="good">✓ Đã xác minh</span>':'<span class="bad">Chưa xác minh</span>'}</div><p>${p.note||''}</p><div class="actions"><a class="go" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">Dẫn đường</a><button class="save" onclick="savePoint('${p.id}')">Lưu</button></div></article>`).join(''):'<div class="panel">Chưa có POI xác minh cho tuyến này.</div>'}</div>`}function renderLibrary(q=''){let r=routeById(currentRouteId),my=userPOI().filter(p=>!q||p.name.toLowerCase().includes(q));main.innerHTML=`<h2>Thư viện</h2><div class="panel"><b>Tuyến đang dùng</b><h3>${r?.name||'—'}</h3><div class="meta">${r?.corridor||''}</div>${r?r.segments.map(s=>`<div class="seg">${s.from} → ${s.to} <span class="meta">· ${s.via.join(' / ')}</span></div>`).join(''):''}</div><h3>Dữ liệu người dùng (${my.length})</h3><div class="grid">${my.map(p=>`<div class="card"><b>${p.name}</b><div class="meta">${p.cat} · ${p.routeId}</div></div>`).join('')||'<div class="panel">Chưa có điểm người dùng.</div>'}</div><button class="pill" onclick="openAdd()">＋ Nhập điểm vào tuyến hiện tại</button>`}function renderAdmin(){let s=session();if(!s||s.role!=='admin'){main.innerHTML='<div class="panel"><h2>Admin</h2><p>Chỉ tài khoản Admin mới truy cập được.</p><button class="pill" onclick="openAccount()">Đăng nhập / thiết lập Admin</button></div>';return}main.innerHTML=`<div class="panel"><h2>Admin Console</h2><p class="good">${s.email}</p><p>Tuyến: ${routeData.routes.length} · User local: ${users().length} · Điểm người dùng: ${userPOI().length}</p><div class="notice">RC1.3 dùng tài khoản cục bộ trên thiết bị. Chưa có backend/cloud auth.</div></div>`}function render(){let q=search.value.toLowerCase().trim();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));cats.style.display=view==='discover'?'flex':'none';if(view==='routes')renderRoutes(q);else if(view==='discover')renderDiscover(q);else if(view==='library')renderLibrary(q);else renderAdmin()}search.oninput=render;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='account')openAccount();else{view=b.dataset.nav;render()}});function savePoint(id){let a=saved();if(!a.includes(id))a.push(id);localStorage.setItem('d1-saved',JSON.stringify(a));alert('Đã lưu')}gpsBtn.onclick=()=>startGPS(true);function startGPS(manual=false){if(!navigator.geolocation){gpsStatus.textContent='GPS: không được hỗ trợ';return}gpsStatus.textContent='GPS: đang xác định…';if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{let a=Math.round(p.coords.accuracy||0);gpsStatus.textContent=`GPS: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;gpsAccuracy.textContent=`Sai số: ±${a} m`;gpsAccuracy.className=a<=50?'good':a<=150?'':'bad';localStorage.setItem('d1-last-gps',JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:a,at:Date.now()}))},e=>{gpsStatus.textContent='GPS: lỗi '+e.code;gpsAccuracy.textContent='Kiểm tra quyền vị trí';gpsAccuracy.className='bad'},{enableHighAccuracy:true,timeout:15000,maximumAge:0});if(manual&&navigator.vibrate)navigator.vibrate(30)}async function hash(t){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function openAccount(){let s=session(),hasAdmin=users().some(u=>u.role==='admin');modal.innerHTML=`<div class="modalbg"><div class="modal"><button class="close" onclick="modal.innerHTML=''">×</button><h2>${s?'Tài khoản':'Đăng nhập'}</h2>${s?`<p><b>${s.email}</b><br><span class="tag">${s.role}</span></p><button onclick="logout()">Đăng xuất</button>`:`<label>Email</label><input id="ae" type="email"><label>Mật khẩu</label><input id="ap" type="password"><button class="primary" onclick="login()">Đăng nhập</button>${!hasAdmin?'<hr><h3>Thiết lập Admin lần đầu</h3><p class="meta">Admin được tạo cục bộ trên thiết bị này.</p><button class="muted" onclick="createAdmin()">Tạo Admin đầu tiên</button>':''}<hr><button class="muted" onclick="createUser()">Tạo tài khoản User</button>`}</div></div>`}async function login(){let e=ae.value.trim().toLowerCase(),p=await hash(ap.value),u=users().find(x=>x.email===e&&x.passwordHash===p);if(!u)return alert('Sai tài khoản hoặc mật khẩu');setSession({email:u.email,role:u.role});modal.innerHTML='';accountBtn.textContent=u.role==='admin'?'Admin':'User';render()}async function createAdmin(){if(users().some(u=>u.role==='admin'))return alert('Thiết bị đã có Admin');let e=ae.value.trim().toLowerCase();if(!e||ap.value.length<6)return alert('Email hợp lệ và mật khẩu tối thiểu 6 ký tự');let a=users();a.push({email:e,passwordHash:await hash(ap.value),role:'admin',createdAt:new Date().toISOString()});setUsers(a);alert('Đã tạo Admin cục bộ');openAccount()}async function createUser(){let e=ae.value.trim().toLowerCase();if(!e||ap.value.length<6)return alert('Email hợp lệ và mật khẩu tối thiểu 6 ký tự');let a=users();if(a.some(u=>u.email===e))return alert('Email đã tồn tại');a.push({email:e,passwordHash:await hash(ap.value),role:'user',createdAt:new Date().toISOString()});setUsers(a);alert('Đã tạo User');openAccount()}function logout(){setSession(null);accountBtn.textContent='Tài khoản';modal.innerHTML='';render()}accountBtn.onclick=openAccount;function openAdd(){let r=routeById(currentRouteId);modal.innerHTML=`<div class="modalbg"><div class="modal"><button class="close" onclick="modal.innerHTML=''">×</button><h2>Nhập điểm thủ công</h2><label>Tuyến</label><input value="${r?.name||''}" disabled><label>Tên điểm</label><input id="pn"><label>Danh mục</label><select id="pc">${categories.slice(1).map(x=>`<option>${x}</option>`).join('')}</select><label>Tọa độ</label><input id="plat" placeholder="Latitude"><input id="plng" placeholder="Longitude"><button class="muted" onclick="fillGPS()">Dùng GPS hiện tại</button><label>Ghi chú</label><textarea id="pnote"></textarea><label><input id="pverify" type="checkbox" style="width:auto"> Tôi đã kiểm chứng tại chỗ</label><button class="primary" onclick="addPoint()">Lưu vào thư viện</button></div></div>`}function fillGPS(){let g=JSON.parse(localStorage.getItem('d1-last-gps')||'null');if(!g)return alert('Chưa có GPS. Nhấn nút GPS ngoài màn hình trước.');plat.value=g.lat;plng.value=g.lng}function addPoint(){let lat=parseFloat(plat.value),lng=parseFloat(plng.value);if(!pn.value.trim()||!Number.isFinite(lat)||!Number.isFinite(lng))return alert('Cần tên và tọa độ hợp lệ');let r=routeById(currentRouteId),a=userPOI();a.unshift({id:'u'+Date.now(),name:pn.value.trim(),cat:pc.value,routeId:r.id,segmentId:null,lat,lng,verified:pverify.checked,note:pnote.value.trim(),createdAt:new Date().toISOString()});localStorage.setItem('d1-user-poi',JSON.stringify(a));modal.innerHTML='';view='library';render()}async function boot(){localStorage.setItem('d1-schema',SCHEMA);currentRouteId=localStorage.getItem('d1-route')||currentRouteId;try{routeData=await fetch('data/routes-pdh.json',{cache:'no-store'}).then(r=>r.json())}catch(e){main.innerHTML='<div class="panel bad">Không tải được dữ liệu tuyến PDH Travel.</div>';return}if(!routeById(currentRouteId))currentRouteId=routeData.routes[0]?.id;updateHero();drawCats();syncInstall();let s=session();if(s)accountBtn.textContent=s.role==='admin'?'Admin':'User';render();startGPS(false);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')}boot();</script></body></html>
