<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163d2a">
  <meta name="description" content="Đi Đâu Đây D1 - PWA du lịch đường dài, GPS, tuyến, thư viện địa điểm và quản trị cục bộ.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Đi Đâu Đây D1</title>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">Đi Đâu Đây<small>D1 · RC2 R-002 B7</small></div>
      <button id="accountBtn" class="pill" type="button">Tài khoản</button>
    </header>
    <section class="hero">
      <button id="gpsBtn" class="gps" type="button" aria-label="Lấy vị trí hiện tại" title="Vị trí hiện tại">⌖</button>
      <small>TUYẾN ĐANG CHỌN</small><h1 id="routeTitle">Đang nạp tuyến…</h1><p id="routeInfo">Đang nạp dữ liệu tuyến.</p>
      <div class="gpsbox" aria-live="polite"><div class="gpsline"><span id="gpsStatus">GPS: chưa bật</span><span id="gpsAccuracy">Sai số: —</span></div><div class="gpsline"><span id="gpsMotion">Tốc độ: — · Hướng: —</span><span id="gpsAge">Tuổi mẫu: —</span></div><div id="routeDetect" class="detect">Map matching: chờ GPS và dữ liệu geometry/trace được duyệt.</div></div>
      <div id="installBox" class="install"><b>Cài ứng dụng</b><p id="installMsg" class="meta">Đang kiểm tra khả năng cài PWA.</p><button id="installBtn" class="primary" type="button">Cài ứng dụng</button></div>
    </section>
    <div class="tabs" aria-label="Chức năng chính"><button type="button" data-view="discovery">Khám phá</button><button type="button" data-view="routes" class="active">Tuyến đường</button><button type="button" data-view="geometry">GPS / Geometry</button><button type="button" data-view="library">Thư viện</button><button type="button" data-view="admin">Admin</button></div>
    <div class="search"><input id="search" type="search" autocomplete="off" placeholder="Tìm tuyến, đoạn đường, địa điểm…"></div>
    <main id="main"><div class="panel">Đang nạp dữ liệu…</div></main>
  </div>
  <nav class="nav" aria-label="Điều hướng dưới"><button type="button" data-nav="discovery">Khám phá</button><button type="button" data-nav="routes" class="active">Tuyến</button><button type="button" data-nav="library">Thư viện</button><button type="button" data-nav="admin">Admin</button><button type="button" data-nav="account">Tài khoản</button></nav>
  <div id="modal"></div>
  <script src="app.js" defer></script>
  <script src="rc2-core.js" defer></script>
  <script src="rc2-discovery.js" defer></script>
  <script src="rc2-data.js" defer></script>
  <script src="rc2-bulk.js" defer></script>
  <script src="rc2-seed.js" defer></script>
  <script src="rc2-geocode.js" defer></script>
  <script src="rc2-driving.js" defer></script>
  <script src="rc2-alerts.js" defer></script>
  <script src="rc2-proactive.js" defer></script>
</body>
</html>
