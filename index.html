<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f4;color:#17211b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:920px;margin:auto;padding:14px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;height:54px;gap:10px}.brand{font-weight:900}.brand small{display:block;color:#708078;font-size:11px}.top-actions{display:flex;gap:8px;align-items:center}.install-icon{border:0;background:#e6a53b;border-radius:12px;min-width:42px;height:42px;font-size:19px;font-weight:900;box-shadow:0 5px 16px #0001}.install-icon.installed{background:#dce9df;color:#1c5a36}.login-link{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 13px;border-radius:12px;background:#173e2a;color:#fff;text-decoration:none;font-size:12px;font-weight:900;box-shadow:0 5px 16px #0001}.badge{font-size:11px;padding:7px 10px;border:1px solid #d9e0db;border-radius:999px;background:#fff}.hero{background:linear-gradient(135deg,#173e2a,#24583f);color:#fff;border-radius:22px;padding:20px}.trip{display:flex;gap:9px}.trip input{width:100%;border:0;border-bottom:1px solid #ffffff55;background:transparent;color:#fff;font-weight:900;font-size:22px;padding:10px 2px;outline:0}.gps{border:0;border-radius:12px;background:#ffffff22;color:#fff;width:44px}.loc{font-size:12px;opacity:.8;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}.stats div{background:#ffffff12;padding:9px;border-radius:11px}.stats small,.stats b{display:block}.stats small{font-size:9px;opacity:.65}.stats b{font-size:11px}.install{margin-top:14px;background:#fff;color:#17211b;border-radius:16px;padding:14px}.ih{display:flex;justify-content:space-between}.state{font-size:10px;font-weight:900;background:#edf3ef;padding:5px 8px;border-radius:999px}.msg{font-size:12px;color:#607067;line-height:1.5;margin:8px 0}.ia{display:flex;gap:8px;flex-wrap:wrap}.ia button{border:0;border-radius:11px;padding:11px 13px;font-weight:900}.primary{background:#e6a53b}.secondary{background:#edf2ee;color:#31513e}.diag{font-size:10px;color:#6f7b73;margin-top:10px}.search{margin-top:14px;background:#fff;border:1px solid #e0e6e1;border-radius:15px;padding:12px}.search input{border:0;outline:0;width:100%}.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.cat{white-space:nowrap;border:1px solid #dce4de;background:#fff;padding:9px 12px;border-radius:12px;font-size:12px;font-weight:800}.cat.active{background:#183d2b;color:#fff}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card,.panel{background:#fff;border:1px solid #e1e7e2;border-radius:17px;padding:15px}.type{font-size:10px;text-transform:uppercase;font-weight:900;color:#748079}.card h3{margin:5px 0}.meta{font-size:11px;color:#738078;display:flex;gap:10px;flex-wrap:wrap}.reason{font-size:12px;line-height:1.5}.trust{font-size:11px;color:#236040;font-weight:800}.actions{display:flex;gap:7px;margin-top:12px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:10px;font-weight:900;font-size:11px}.go{background:#1b4932;color:#fff}.save{background:#eef3ef;color:#31513e}.nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:#fffffff2;border-top:1px solid #dde3df;display:flex;justify-content:center;backdrop-filter:blur(9px)}.nav button{flex:1;max-width:180px;border:0;background:transparent;font-size:11px;font-weight:900}.nav .active{color:#17462e}.fab{position:fixed;right:14px;bottom:76px;background:#e6a53b;border:0;border-radius:999px;padding:13px 16px;font-weight:900}.modalbg{position:fixed;inset:0;background:#07110b88;display:flex;align-items:flex-end;justify-content:center;z-index:30}.modal{width:min(560px,100%);background:#fff;padding:20px;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto}.modal input,.modal select,.modal textarea{width:100%;margin:5px 0 12px;padding:11px;border:1px solid #dce3de;border-radius:11px}.close{float:right;border:0;background:#eef2ef;border-radius:10px;width:36px;height:36px}@media(max-width:700px){.cards{grid-template-columns:1fr}.app{padding-left:11px;padding-right:11px}.ia button{flex:1}.badge{display:none}.install-icon{display:inline-flex;align-items:center;justify-content:center;position:sticky;top:8px;z-index:20}}

</head><body><div class="app"><div class="top"><div class="brand">Đi Đâu Đây<small>A1 · RC4 GitHub Install</small></div><div class="top-actions"><a class="login-link" href="https://di-dau-day-a1-mobile.giaphatgpt123.chatgpt.site/" target="_blank" rel="noopener">Đăng nhập</a><button id="installQuick" class="install-icon" title="Cài ứng dụng" aria-label="Cài ứng dụng">⬇ Cài</button><div class="badge" id="ver">RC4</div></div></div><section class="hero"><small>HÀNH TRÌNH ĐANG ĐI</small><div class="trip"><input id="trip" value="TP.HCM → Huế"><button class="gps" id="gps">◎</button></div><div class="loc" id="loc">Chưa xác định vị trí</div><div class="stats"><div><small>CHẾ ĐỘ</small><b>Ô tô đường dài</b></div><div><small>ƯU TIÊN</small><b>Ít lệch tuyến</b></div><div><small>PHẠM VI</small><b>20–50 km</b></div></div><div class="install"><div class="ih"><b>Cài Đi Đâu Đây</b><span class="state" id="state">Đang kiểm tra</span></div><div class="msg" id="msg">Kiểm tra khả năng cài trên thiết bị này.</div><div class="ia"><button class="primary" id="installBtn">Cài ứng dụng</button><button class="secondary" id="help">Hướng dẫn</button><button class="secondary" id="share">Chia sẻ link cài</button></div><div id="update" style="display:none;margin-top:10px">Có phiên bản mới. <button id="reload">Cập nhật ngay</button></div><div class="diag" id="diag"></div></div><div class="release-links"><a class="full-app" href="https://di-dau-day-a1-mobile.giaphatgpt123.chatgpt.site/" target="_blank" rel="noopener">Đăng nhập / Quản trị</a><a class="full-app" href="https://github.com/giaphatgpt123-wq/di-dau-day">Mã nguồn GitHub</a></div><div class="qrbox"><img src="install-qr.png" alt="Mã QR cài Đi Đâu Đây A1"><b>Quét QR để cài từ GitHub Pages</b></div></section><div class="search"><input id="search" placeholder="Tìm quán ăn, khách sạn, cây xăng…"></div><div class="cats" id="cats"></div><main id="main"></main></div><button class="fab" id="add">＋ Nhập điểm</button><nav class="nav"><button data-tab="discover" class="active">Khám phá</button><button data-tab="trip">Hành trình</button><button data-tab="library">Thư viện</button></nav><div id="modal"></div>
<script>
const APP_VERSION='A1-RC4-GH1',SCHEMA=2;const seed=[{id:1,name:'Trạm dừng Suối Tiên',cat:'Trạm dừng',area:'TP.HCM → Đồng Nai',distance:12,detour:1.2,rating:4.5,reason:'Sát trục đường, dễ quay lại tuyến, có chỗ nghỉ và vệ sinh.',verified:true,lat:10.872,lng:106.803},{id:2,name:'Cơm niêu ven QL1A',cat:'Ăn uống',area:'Đồng Nai',distance:28,detour:.8,rating:4.6,reason:'Phù hợp bữa trưa, bãi đỗ ô tô thuận tiện, lệch tuyến rất ít.',verified:true,lat:10.948,lng:107.012},{id:3,name:'Cà phê view hồ',cat:'Coffee',area:'Bình Thuận',distance:64,detour:3.4,rating:4.7,reason:'Điểm nghỉ ngắn phù hợp nhóm gia đình.',verified:false,lat:11.115,lng:108.104},{id:4,name:'Khách sạn trung tâm',cat:'Lưu trú',area:'Phan Rang',distance:121,detour:2.1,rating:4.4,reason:'Dễ đỗ xe, gần ăn uống, phù hợp nghỉ qua đêm.',verified:true,lat:11.568,lng:108.989},{id:5,name:'Cây xăng 24/7',cat:'Cây xăng',area:'QL1A',distance:17,detour:.2,rating:4.3,reason:'Gần tuyến, có cửa hàng tiện lợi.',verified:true,lat:10.912,lng:106.921}];const catList=['Tất cả','Ăn uống','Coffee','Lưu trú','Cây xăng','Tham quan','Trạm dừng'];let active='Tất cả',tab='discover',promptEvent=null,waiting=null,saved=JSON.parse(localStorage.getItem('d1-saved')||'[]'),custom=JSON.parse(localStorage.getItem('d1-custom')||'[]');localStorage.setItem('d1-schema',SCHEMA);ver.textContent=APP_VERSION;trip.value=localStorage.getItem('d1-trip')||trip.value;trip.oninput=()=>localStorage.setItem('d1-trip',trip.value);const all=()=>[...custom,...seed];const maps=p=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.lat&&p.lng?`${p.lat},${p.lng}`:p.name)}`;function drawCats(){cats.innerHTML=catList.map(c=>`<button class="cat ${c===active?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;drawCats();render()})}function render(){let q=search.value.toLowerCase().trim();if(tab==='discover'){let list=all().filter(p=>(active==='Tất cả'||p.cat===active)&&(!q||`${p.name} ${p.cat} ${p.area}`.toLowerCase().includes(q))).sort((a,b)=>a.detour-b.detour);main.innerHTML=`<h2>Nên dừng ở đâu? <small>(${list.length})</small></h2><div class="cards">${list.map(p=>`<article class="card"><div class="type">${p.cat}</div><h3>${p.name}</h3><div class="meta"><span>${p.distance} km phía trước</span><span>lệch ${p.detour} km</span><span>★ ${p.rating||'Mới'}</span></div><p class="reason">${p.reason}</p>${p.verified?'<div class="trust">✓ Đã xác minh</div>':''}<div class="actions"><a class="go" target="_blank" href="${maps(p)}">Dẫn đường</a><button class="save" onclick="toggle(${p.id})">${saved.includes(p.id)?'Đã lưu':'Lưu'}</button></div></article>`).join('')}</div>`}else if(tab==='trip'){main.innerHTML='<h2>Hành trình</h2><div class="panel">TP.HCM → Phan Thiết → Phan Rang → Nha Trang → Quy Nhơn → Huế</div>'}else{let list=all().filter(p=>saved.includes(p.id)||custom.some(x=>x.id===p.id));main.innerHTML=`<h2>Thư viện</h2><div class="panel">${list.length?list.map(p=>`<p><b>${p.name}</b><br><small>${p.cat} · ${p.area}</small></p>`).join(''):'Chưa có địa điểm.'}</div>`}}window.toggle=id=>{saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('d1-saved',JSON.stringify(saved));render()};search.oninput=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});gps.onclick=()=>{loc.textContent='Đang lấy GPS…';navigator.geolocation?.getCurrentPosition(p=>loc.textContent=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`,()=>loc.textContent='Không lấy được GPS',{enableHighAccuracy:true,timeout:8000})};function device(){let ua=navigator.userAgent;return{ios:/iPhone|iPad|iPod/i.test(ua),android:/Android/i.test(ua),standalone:matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}}function installUI(){let d=device();installQuick.classList.toggle('installed',d.standalone);installQuick.textContent=d.standalone?'✓':'⬇';installQuick.title=d.standalone?'Ứng dụng đã cài':'Cài ứng dụng';if(d.standalone){state.textContent='Đã cài';msg.textContent='Ứng dụng đang chạy độc lập.';installBtn.disabled=true;installBtn.textContent='Đã cài'}else if(promptEvent){state.textContent='Sẵn sàng cài';msg.textContent='Thiết bị đủ điều kiện cài PWA.';installBtn.disabled=false;installBtn.textContent='Cài ngay'}else if(d.ios){state.textContent='iPhone/iPad';msg.textContent='Safari: Chia sẻ → Thêm vào Màn hình chính.';installBtn.disabled=false;installBtn.textContent='Xem cách cài'}else if(d.android){state.textContent='Android';msg.textContent='Chrome/Edge: chờ trình duyệt bật lời mời cài hoặc dùng menu ⋮.';installBtn.disabled=false;installBtn.textContent='Cài ứng dụng'}else{state.textContent='Trình duyệt';msg.textContent='Chrome/Edge hỗ trợ cài tốt nhất.';installBtn.disabled=false;installBtn.textContent='Cài ứng dụng'}diag.innerHTML=`HTTPS: <b>${location.protocol==='https:'||location.hostname==='localhost'?'PASS':'FAIL'}</b> · Manifest: <b>PASS</b> · SW: <b>${'serviceWorker'in navigator?'PASS':'FAIL'}</b> · Standalone: <b>${d.standalone?'YES':'NO'}</b> · Version: <b>${APP_VERSION}</b>`}addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;installUI()});addEventListener('appinstalled',()=>{promptEvent=null;localStorage.setItem('d1-installed-at',new Date().toISOString());installUI()});async function requestInstall(){let d=device();if(d.standalone)return;if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;installUI();return}showHelp()}installBtn.onclick=requestInstall;installQuick.onclick=requestInstall;help.onclick=showHelp;function showHelp(){let d=device(),body=d.ios?'1. Mở bằng Safari. 2. Chạm Chia sẻ. 3. Chọn Thêm vào Màn hình chính. 4. Chạm Thêm.':d.android?'1. Mở bằng Chrome hoặc Edge. 2. Chạm nút Cài nếu xuất hiện. 3. Nếu chưa có, mở menu ⋮ và chọn Cài ứng dụng/Thêm vào màn hình chính.':'Chrome/Edge: dùng nút Cài ứng dụng hoặc biểu tượng Install trên thanh địa chỉ.';modal.innerHTML=`<div class="modalbg"><div class="modal"><button class="close" onclick="modal.innerHTML=''">×</button><h2>Cài Đi Đâu Đây</h2><p>${body}</p><p><small>${APP_VERSION}</small></p></div></div>`}share.onclick=async()=>{let url=location.origin+location.pathname.replace(/index\.html$/,'');try{if(navigator.share)await navigator.share({title:'Đi Đâu Đây',text:'Link cài Đi Đâu Đây',url});else{await navigator.clipboard.writeText(url);alert('Đã sao chép link cài.')}}catch(e){}};add.onclick=()=>{modal.innerHTML=`<div class="modalbg"><div class="modal"><button class="close" onclick="modal.innerHTML=''">×</button><h2>Thêm địa điểm</h2><input id="n" placeholder="Tên địa điểm"><select id="c">${catList.slice(1).map(x=>`<option>${x}</option>`).join('')}</select><textarea id="note" placeholder="Ghi chú"></textarea><button class="primary" id="submit">Lưu</button></div></div>`;submit.onclick=()=>{if(!n.value.trim())return alert('Cần tên địa điểm');custom.unshift({id:Date.now(),name:n.value.trim(),cat:c.value,area:loc.textContent,distance:0,detour:0,rating:0,reason:note.value||'Điểm do người dùng nhập.',verified:true,lat:0,lng:0});localStorage.setItem('d1-custom',JSON.stringify(custom));modal.innerHTML='';tab='library';render()}};if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(reg=>{if(reg.waiting){waiting=reg.waiting;update.style.display='block'}reg.addEventListener('updatefound',()=>{let nw=reg.installing;nw?.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){waiting=nw;update.style.display='block'}})})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}reload.onclick=()=>waiting?waiting.postMessage({type:'SKIP_WAITING'}):location.reload();matchMedia('(display-mode: standalone)').addEventListener?.('change',installUI);drawCats();render();installUI();
</script></body></html>
