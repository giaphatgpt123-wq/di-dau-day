<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153d2a"><meta name="description" content="PDH Travel D1 RC1.4.1 GPS geometry"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><title>Đi Đâu Đây · PDH Travel</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17211b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.app{max-width:980px;margin:auto;padding:12px 12px 90px}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:950}.brand small{display:block;font-size:10px;color:#718078}.pill,.btn{border:1px solid #d8e0da;background:#fff;border-radius:11px;padding:9px 12px;font-weight:850;font-size:11px}.hero{position:relative;background:linear-gradient(135deg,#153d2a,#245b40);color:#fff;border-radius:22px;padding:18px}.hero h1{font-size:21px;margin:5px 78px 6px 0}.hero p{font-size:12px;margin:0;opacity:.86}.gps{position:absolute;right:14px;top:14px;width:66px;height:66px;border:0;border-radius:50%;background:#f2b64a;font-size:30px;font-weight:950;box-shadow:0 8px 20px #0004}.gps.on{outline:4px solid #ffffff66}.gpsbox{margin-top:14px;background:#ffffff14;border-radius:14px;padding:11px}.gpsline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px}.gpsline+.gpsline{margin-top:7px}.detect{margin-top:9px;padding-top:9px;border-top:1px solid #ffffff22;font-size:12px;line-height:1.5}.install{margin-top:12px;background:#fff;color:#17211b;border-radius:15px;padding:12px}.install.hidden{display:none}.install button{border:0;border-radius:10px;padding:10px 12px;font-weight:900}.primary{background:#f2b64a}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button{white-space:nowrap;border:1px solid #dbe3dd;background:#fff;border-radius:12px;padding:10px 13px;font-weight:850;font-size:12px}.tabs button.active{background:#153d2a;color:#fff}.search{background:#fff;border:1px solid #e0e7e2;border-radius:14px;padding:11px;margin-bottom:12px}.search input{width:100%;border:0;outline:0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}.metric,.panel{background:#fff;border:1px solid #e0e7e2;border-radius:15px;padding:12px}.metric b{font-size:18px;display:block}.metric small,.meta{font-size:10px;color:#6e7d74}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tag{display:inline-block;background:#edf3ef;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850;margin:0 4px 5px 0}.warn{background:#fff1d7;color:#885d00}.bad{color:#9a3028}.good{color:#17633d;font-weight:900}.seg{border-top:1px solid #edf1ee;padding:9px 0;font-size:12px}.notice{font-size:11px;background:#fff8e7;border:1px solid #f0ddaf;padding:10px;border-radius:12px;margin:10px 0}.node-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.node-actions button{border:0;border-radius:9px;padding:8px 10px;font-weight:850;font-size:10px}.nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fffffff2;border-top:1px solid #dce4de;display:flex;justify-content:center;backdrop-filter:blur(10px)}.nav button{flex:1;max-width:220px;border:0;background:transparent;font-size:11px;font-weight:900}.nav button.active{color:#17452f}.modalbg{position:fixed;inset:0;background:#07110b99;display:flex;align-items:flex-end;justify-content:center;z-index:40}.modal{width:min(560px,100%);background:#fff;padding:20px;border-radius:22px 22px 0 0}.modal input{width:100%;padding:11px;border:1px solid #dae2dc;border-radius:10px;margin:5px 0 11px}@media(max-width:720px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="app"><header class="top"><div class="brand">Đi Đâu Đây<small>PDH Travel · D1-RC1.4.1 · GPS geometry</small></div><button class="pill" id="accountBtn">Tài khoản</button></header><section class="hero"><button class="gps" id="gpsBtn" aria-label="Bật GPS">⌖</button><small>TUYẾN ĐANG CHỌN</small><h1 id="routeTitle">Đang tải PDH…</h1><p id="routeInfo">Geometry chỉ dùng khi đã duyệt.</p><div class="gpsbox"><div class="gpsline"><span id="gpsStatus">GPS: chưa xác định</span><span id="gpsAccuracy">Sai số: —</span></div><div class="gpsline"><span id="gpsMotion">Tốc độ: — · Hướng: —</span><span id="gpsAge">Tuổi mẫu: —</span></div><div class="detect" id="routeDetect">Map matching: chờ GPS và geometry đã duyệt.</div></div><div class="install" id="installBox"><b>Cài ứng dụng</b><div class="meta" id="installMsg">Đang kiểm tra khả năng cài.</div><button class="primary" id="installBtn">Cài ngay</button></div></section><div class="tabs"><button data-view="routes" class="active">Mạng tuyến</button><button data-view="geometry">Geometry 53 nút</button><button data-view="library">Thư viện tuyến</button><button data-view="admin">Admin</button></div><div class="search"><input id="search" placeholder="Tìm tuyến, nút, địa danh…"></div><main id="main"><div class="panel">Đang tải dữ liệu PDH…</div></main></div><nav class="nav"><button data-nav="routes" class="active">Tuyến</button><button data-nav="geometry">GPS nút</button><button data-nav="library">Thư viện</button><button data-nav="account">Tài khoản</button></nav><div id="modal"></div><script>const APP_VERSION='D1-RC1.4.1',DATA_VERSION='PDH-ROUTES-2.0',GEOMETRY_VERSION='PDH-GEOMETRY-1.0';let routeData={routes:[],summary:{}},geometryBase={nodes:[],summary:{}},currentRouteId=localStorage.getItem('d1-route')||'R-001',view='routes',installPrompt=null,watchId=null,gpsActive=false,fixes=[],lastAccepted=null,lastFix=null;const $=id=>document.getElementById(id),users=()=>JSON.parse(localStorage.getItem('d1-users')||'[]'),session=()=>JSON.parse(localStorage.getItem('d1-session')||'null'),setUsers=v=>localStorage.setItem('d1-users',JSON.stringify(v)),setSession=v=>v?localStorage.setItem('d1-session',JSON.stringify(v)):localStorage.removeItem('d1-session'),geometryLocal=()=>JSON.parse(localStorage.getItem('d1-geometry-overrides')||'{}'),setGeometryLocal=v=>localStorage.setItem('d1-geometry-overrides',JSON.stringify(v));function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function syncInstall(){if(isStandalone()){$('installBox').classList.add('hidden');return}$('installBox').classList.remove('hidden');$('installMsg').textContent=installPrompt?'Thiết bị sẵn sàng cài PWA.':'Chrome/Edge → menu → Cài ứng dụng.'}addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;syncInstall()});addEventListener('appinstalled',()=>{installPrompt=null;syncInstall()});$('installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;syncInstall()}else alert($('installMsg').textContent)};function routeById(id){return routeData.routes.find(r=>r.id===id)||routeData.routes[0]}function selectRoute(id,source='manual'){currentRouteId=id;localStorage.setItem('d1-route',id);localStorage.setItem('d1-route-source',source);updateHero();render()}function updateHero(){const r=routeById(currentRouteId);if(!r)return;$('routeTitle').textContent=`${r.id} · ${r.name}`;$('routeInfo').textContent=`${r.group} · ${r.segments.length} đoạn · geometry approved only`}function mergedNodes(){const ov=geometryLocal();return geometryBase.nodes.map(n=>({...n,lat:null,lng:null,accuracy:null,status:'PENDING_COORDINATE',approval:'PENDING_ADMIN_APPROVAL',...(ov[n.id]||{})}))}function geomCounts(){const n=mergedNodes();return{approved:n.filter(x=>x.status==='APPROVED_GEOMETRY').length,captured:n.filter(x=>x.status==='FIELD_CAPTURED').length,pending:n.filter(x=>x.status==='PENDING_COORDINATE').length}}function metrics(){const s=routeData.summary,g=geomCounts();return `<div class="metrics"><div class="metric"><b>${s.corridors??'—'}</b><small>HÀNH LANG</small></div><div class="metric"><b>${s.segments??'—'}</b><small>ĐOẠN</small></div><div class="metric"><b>${s.nodes??'—'}</b><small>NÚT</small></div><div class="metric"><b>${g.approved}</b><small>GEOMETRY DUYỆT</small></div><div class="metric"><b>${g.captured}</b><small>ĐÃ GHI GPS</small></div><div class="metric"><b>${g.pending}</b><small>CHỜ TỌA ĐỘ</small></div></div>`}function renderRoutes(q=''){const list=routeData.routes.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));$('main').innerHTML=`<h2>Mạng tuyến PDH Travel</h2>${metrics()}<div class="notice"><b>Đã bỏ nhận diện bằng tọa độ thành phố hard-code.</b> Tự nhận diện chỉ chạy khi có geometry nút đã Admin duyệt.</div><div class="grid">${list.map(r=>`<article class="panel" onclick="selectRoute('${r.id}')"><span class="tag">${r.id}</span><span class="tag">${r.group}</span><h3>${r.name}</h3><div class="meta">${r.primary}</div>${r.segments.map(s=>`<div class="seg"><b>${s.id} · ${s.from} → ${s.to}</b><div class="meta">${s.road} · ${s.status}</div></div>`).join('')}</article>`).join('')}</div>`}function renderGeometry(q=''){const list=mergedNodes().filter(n=>!q||`${n.id} ${n.name} ${n.status}`.toLowerCase().includes(q));const admin=session()?.role==='admin';$('main').innerHTML=`<h2>Geometry nút PDH <small>(${list.length}/53)</small></h2>${metrics()}<div class="notice">Quy trình: bật GPS → đến đúng nút → Ghi GPS nút → kiểm tra sai số → Admin duyệt. Map-matching chỉ sử dụng <b>APPROVED_GEOMETRY</b>.</div><div class="grid">${list.map(n=>`<div class="panel"><span class="tag">${n.id}</span><span class="tag ${n.status==='APPROVED_GEOMETRY'?'good':n.status==='FIELD_CAPTURED'?'warn':''}">${n.status}</span><h3>${n.name}</h3><div class="meta">${Number.isFinite(n.lat)?`${n.lat.toFixed(6)}, ${n.lng.toFixed(6)} · ±${n.accuracy||'—'} m`:'Chưa có tọa độ'}</div><div class="node-actions"><button class="primary" onclick="captureNode('${n.id}')">Ghi GPS nút</button>${admin&&n.status==='FIELD_CAPTURED'?`<button onclick="approveNode('${n.id}')">Duyệt geometry</button>`:''}${admin&&n.status!=='PENDING_COORDINATE'?`<button onclick="resetNode('${n.id}')">Xóa ghi nhận</button>`:''}</div></div>`).join('')}</div>`}function renderLibrary(){const r=routeById(currentRouteId);$('main').innerHTML=`<h2>Thư viện tuyến</h2>${metrics()}<div class="panel"><span class="tag">${r.id}</span><h3>${r.name}</h3><p><b>Tuyến chính:</b> ${r.primary}</p><p><b>Thay thế:</b> ${r.alternate}</p><p><b>Kiểm soát:</b> ${r.controlNote}</p></div>`}function renderAdmin(){const s=session();if(!s||s.role!=='admin'){$('main').innerHTML='<div class="panel"><h2>Admin</h2><p>Chưa đăng nhập Admin.</p><button class="pill" onclick="openAccount()">Đăng nhập / tạo Admin</button></div>';return}const g=geomCounts();$('main').innerHTML=`<div class="panel"><h2>Admin Geometry Gate</h2><p>${s.email}</p><p>Approved: <b>${g.approved}/53</b> · Field captured: <b>${g.captured}</b> · Pending: <b>${g.pending}</b></p><div class="notice">QA-005 chỉ được bỏ BLOCK khi 53 nút có tọa độ phù hợp và được duyệt. QA-010 vẫn BLOCK cho đến khi có route engine liên tục.</div></div>`}function render(){const q=$('search').value.toLowerCase().trim();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));if(view==='routes')renderRoutes(q);else if(view==='geometry')renderGeometry(q);else if(view==='library')renderLibrary();else renderAdmin()}$('search').oninput=render;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='account')openAccount();else{view=b.dataset.nav;render()}});function rad(x){return x*Math.PI/180}function distanceKm(a,b){const R=6371,dLat=rad(b.lat-a.lat),dLon=rad(b.lng-a.lng),s=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(s)))}function pointSegKm(p,a,b){const lat0=rad(p.lat),kx=111.320*Math.cos(lat0),ky=110.574,px=(p.lng-a.lng)*kx,py=(p.lat-a.lat)*ky,bx=(b.lng-a.lng)*kx,by=(b.lat-a.lat)*ky,den=bx*bx+by*by,t=den?Math.max(0,Math.min(1,(px*bx+py*by)/den)):0;return Math.hypot(px-t*bx,py-t*by)}function norm(s=''){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}function nodeForName(name){const key=norm(name);return mergedNodes().find(n=>n.status==='APPROVED_GEOMETRY'&&(norm(n.name)===key||norm(n.name).includes(key)||key.includes(norm(n.name))))}function recognizeRoute(f){let candidates=[];for(const r of routeData.routes){let best={distance:Infinity,near:'—',segmentId:null};for(const s of r.segments){const a=nodeForName(s.from),b=nodeForName(s.to);if(a&&b){const d=pointSegKm(f,a,b);if(d<best.distance)best={distance:d,near:`${s.from} → ${s.to}`,segmentId:s.id}}else{for(const n of [a,b].filter(Boolean)){const d=distanceKm(f,n);if(d<best.distance)best={distance:d,near:n.name,segmentId:s.id}}}}if(Number.isFinite(best.distance))candidates.push({route:r,...best})}candidates.sort((a,b)=>a.distance-b.distance);const best=candidates[0],second=candidates[1];if(!best)return null;const margin=second?second.distance-best.distance:99;let confidence='THẤP';if(f.accuracy<=40&&best.distance<=1.5&&margin>=.5)confidence='CAO';else if(f.accuracy<=80&&best.distance<=5)confidence='TRUNG BÌNH';return{...best,confidence,margin}}function weightedFix(){if(!fixes.length)return null;let sw=0,lat=0,lng=0,acc=0;for(const f of fixes){const w=1/Math.max(25,f.accuracy*f.accuracy);sw+=w;lat+=f.lat*w;lng+=f.lng*w;acc+=f.accuracy*w}const n=fixes.at(-1);return{...n,lat:lat/sw,lng:lng/sw,accuracy:Math.round(acc/sw)}}function acceptableFix(f){if(!Number.isFinite(f.lat)||!Number.isFinite(f.lng)||!Number.isFinite(f.accuracy)||f.accuracy>250)return false;if(lastAccepted){const dt=(f.at-lastAccepted.at)/1000;if(dt>0&&distanceKm(lastAccepted,f)/dt*3600>250)return false}return true}function quality(a){return a<=25?'RẤT TỐT':a<=50?'TỐT':a<=100?'TRUNG BÌNH':'YẾU'}function renderFix(f){lastFix=f;$('gpsStatus').textContent=`GPS: ${f.lat.toFixed(5)}, ${f.lng.toFixed(5)}`;$('gpsAccuracy').textContent=`±${f.accuracy} m · ${quality(f.accuracy)}`;$('gpsMotion').textContent=`Tốc độ: ${Number.isFinite(f.speed)&&f.speed>=0?Math.round(f.speed*3.6)+' km/h':'—'} · Hướng: ${Number.isFinite(f.heading)&&f.heading>=0?Math.round(f.heading)+'°':'—'}`;$('gpsAge').textContent=`Tuổi mẫu: ${Math.max(0,Math.round((Date.now()-f.at)/1000))}s`;const rr=recognizeRoute(f);if(!rr){$('routeDetect').innerHTML='Map matching: <b>chưa có đủ geometry đã duyệt</b>. Không tự đổi tuyến.';return}const d=rr.distance<1?Math.round(rr.distance*1000)+' m':rr.distance.toFixed(1)+' km';$('routeDetect').innerHTML=`Ứng viên: <b>${rr.route.id} · ${rr.route.name}</b><br>Gần ${rr.near} · ${d} · tin cậy <b>${rr.confidence}</b>`;if(rr.confidence==='CAO'&&currentRouteId!==rr.route.id)selectRoute(rr.route.id,'approved-geometry');localStorage.setItem('d1-route-detection',JSON.stringify({routeId:rr.route.id,segmentId:rr.segmentId,distanceKm:rr.distance,confidence:rr.confidence,at:Date.now()}))}function onPosition(p){const f={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy||999,speed:p.coords.speed,heading:p.coords.heading,at:p.timestamp||Date.now()};if(!acceptableFix(f)){$('gpsAccuracy').textContent=`Mẫu loại · ±${Math.round(f.accuracy)} m`;return}lastAccepted=f;fixes.push(f);if(fixes.length>7)fixes.shift();const sm=weightedFix();localStorage.setItem('d1-last-gps',JSON.stringify(sm));renderFix(sm)}function onErr(e){$('gpsStatus').textContent=`GPS lỗi ${e.code}`;$('gpsAccuracy').textContent='Kiểm tra quyền vị trí'}function startGPS(){if(!navigator.geolocation)return;$('gpsBtn').classList.add('on');gpsActive=true;if(watchId!==null)navigator.geolocation.clearWatch(watchId);navigator.geolocation.getCurrentPosition(onPosition,()=>{},{enableHighAccuracy:false,timeout:5000,maximumAge:10000});watchId=navigator.geolocation.watchPosition(onPosition,onErr,{enableHighAccuracy:true,timeout:20000,maximumAge:0})}$('gpsBtn').onclick=startGPS;window.captureNode=id=>{if(!lastFix)return alert('Bật GPS và chờ có vị trí trước.');if(lastFix.accuracy>80)return alert('Sai số GPS còn lớn hơn 80 m. Hãy chờ tín hiệu tốt hơn.');const ov=geometryLocal();ov[id]={lat:lastFix.lat,lng:lastFix.lng,accuracy:lastFix.accuracy,capturedAt:Date.now(),capturedBy:session()?.email||'local-loader',status:'FIELD_CAPTURED',approval:'PENDING_ADMIN_APPROVAL'};setGeometryLocal(ov);render();alert(`Đã ghi GPS ${id} · chờ Admin duyệt.`)};window.approveNode=id=>{if(session()?.role!=='admin')return alert('Cần Admin.');const ov=geometryLocal();if(!ov[id])return;ov[id].status='APPROVED_GEOMETRY';ov[id].approval='APPROVED';ov[id].approvedAt=Date.now();ov[id].approvedBy=session().email;setGeometryLocal(ov);render();if(lastFix)renderFix(lastFix)};window.resetNode=id=>{if(session()?.role!=='admin')return;const ov=geometryLocal();delete ov[id];setGeometryLocal(ov);render()};async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}window.openAccount=function(){const s=session();$('modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Tài khoản</h2>${s?`<p><b>${s.email}</b> · ${s.role}</p><button onclick="logout()">Đăng xuất</button>`:`<input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Mật khẩu"><button class="primary" onclick="login()">Đăng nhập</button> <button onclick="createAdmin()">Tạo Admin đầu tiên</button>`}</div></div>`};window.closeModal=()=>{$('modal').innerHTML=''};window.createAdmin=async()=>{const email=$('email').value.trim().toLowerCase(),pass=$('pass').value;if(!email||pass.length<6)return alert('Email hợp lệ, mật khẩu ≥6 ký tự');let u=users();if(u.some(x=>x.role==='admin'))return alert('Thiết bị đã có Admin');u.push({email,passHash:await hash(pass),role:'admin'});setUsers(u);setSession({email,role:'admin'});closeModal();render()};window.login=async()=>{const email=$('email').value.trim().toLowerCase(),ph=await hash($('pass').value),u=users().find(x=>x.email===email&&x.passHash===ph);if(!u)return alert('Sai tài khoản/mật khẩu');setSession({email:u.email,role:u.role});closeModal();render()};window.logout=()=>{setSession(null);closeModal();render()};$('accountBtn').onclick=openAccount;async function boot(){syncInstall();try{const [r,g]=await Promise.all([fetch(`data/routes-pdh.json?v=${DATA_VERSION}`,{cache:'reload'}),fetch(`data/geometry-pdh.json?v=${GEOMETRY_VERSION}`,{cache:'reload'})]);routeData=await r.json();geometryBase=await g.json();if(routeData.version!==DATA_VERSION||geometryBase.version!==GEOMETRY_VERSION)throw new Error('Sai version dữ liệu');if(!routeData.routes.some(x=>x.id===currentRouteId))currentRouteId='R-001';updateHero();render();const cached=JSON.parse(localStorage.getItem('d1-last-gps')||'null');if(cached&&Date.now()-cached.at<3600000)renderFix(cached)}catch(e){$('main').innerHTML=`<div class="panel"><h2>Lỗi nạp dữ liệu</h2><p>${e.message}</p></div>`}}boot();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
