plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

def releaseSigningReady = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }

android {
    namespace 'com.pdhtravel.didauday'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pdhtravel.didauday'
        minSdk 26
        targetSdk 35
        versionCode 200
        versionName '2.0.0'
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
}

def verifyReleaseSigningTask = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseSigningReady) throw new GradleException('Release signing variables are missing. Use GitHub Actions secrets; never commit the keystore to this public repository.')
    }
}

tasks.configureEach { task ->
    if (task.name == 'assembleRelease') task.dependsOn verifyReleaseSigningTask
}

tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html'
        include 'rc2-app-services-v3.js'
        include 'app.js'
        include 'rc2-core.js'
        include 'rc2-discovery.js'
        include 'rc2-data.js'
        include 'rc2-bulk.js'
        include 'rc2-seed.js'
        include 'rc2-geocode.js'
        include 'rc2-gps-health.js'
        include 'rc2-engine-v3.js'
        include 'rc2-driving.js'
        include 'rc2-alerts.js'
        include 'rc2-proactive.js'
        include 'rc2-driver-rest.js'
        include 'rc2-trip-status.js'
        include 'rc2-driving-mode.js'
        include 'rc2-unified-driving-ui.js'
        include 'styles.css'
        include 'manifest.webmanifest'
        include 'data/**'
        include 'icons/**'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}

preBuild.dependsOn syncWebAssets
